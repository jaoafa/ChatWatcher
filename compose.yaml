services:
  koemoji:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: all
      # every utterance is recognized by every engine and posted as "[engine] user: text"
      ASR_ENGINES: sensevoice,reazon-ja,reazon-ja-en
      # one worker thread per entry; name:N runs N workers for that engine
      WORKER_ENGINES: sensevoice,reazon-ja,reazon-ja-en
      ASR_THREADS: 2
      ASR_LANGUAGE: ja
      ASR_PAD_MS: 300
    volumes:
      - ./data:/data
